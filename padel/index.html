<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#08111f"/>
  <title>United Sports Club — Padel &amp; Pickleball · Mombasa</title>
  <meta name="description" content="Book padel and pickleball courts at United Sports Club, Mombasa."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/flow.css"/>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <script defer src="js/booking.js"></script>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <img src="../restaurant/images/usclogo.png" alt="United Sports Club" class="splash-logo"/>
    <div class="splash-brand">United Sports Club</div>
    <div class="splash-tagline">Padel &amp; Pickleball · Mombasa</div>
    <div class="splash-loader"><span></span><span></span><span></span></div>
  </div>
</div>

<header class="usc-nav">
  <div class="usc-nav-left">
    <a href="../index.html" class="usc-back-link">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      <span class="back-label">Dashboard</span>
    </a>
  </div>
  <div class="usc-nav-logo">
    <img src="../restaurant/images/usclogo.png" alt="USC" class="usc-nav-logo-icon"/>
    <div class="usc-nav-text">
      <div class="usc-nav-brand">United Sports Club</div>
      <div class="usc-nav-sub">Court Booking</div>
    </div>
  </div>
  <div class="usc-nav-right" id="userBar"></div>
</header>

<!-- Every step of the booking flow is rendered here by js/booking.js -->
<main id="stage" class="screen"></main>

<!-- Selection bar: only visible on the time step once a slot is picked -->
<div id="bar">
  <div class="bar-inner">
    <div class="bar-text">
      <span class="bar-label" id="bar-label"></span>
      <span id="bar-main"></span>
    </div>
    <button type="button" id="bar-next" data-act="to-team">
      <span id="bar-next-label">Continue</span>
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
