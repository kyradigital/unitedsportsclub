<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>United Sports Club — Restaurant · Mombasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet"/>
  <link rel="preload" as="image" href="images/chips.webp"/>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <script defer src="menu-data.js"></script>
  <script defer src="script.js"></script>
</head>
<body class="ch-mode">

<div id="splash">
  <div class="splash-inner">
    <img src="images/usclogo.png" alt="United Sports Club" class="splash-logo"/>
    <div class="splash-brand">United Sports Club</div>
    <div class="splash-tagline">Restaurant · Mombasa</div>
    <div class="splash-loader"><span></span><span></span><span></span></div>
  </div>
</div>

<header class="usc-nav" id="main-nav">
  <div class="usc-nav-left">
    <a href="../index.html" class="usc-back-link">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      <span class="back-label">Dashboard</span>
    </a>
  </div>
  <div class="usc-nav-logo">
    <img src="images/usclogo.png" alt="USC" class="usc-nav-logo-icon"/>
    <div class="usc-nav-text">
      <div class="usc-nav-brand">United Sports Club</div>
      <div class="usc-nav-sub">Restaurant</div>
    </div>
  </div>
  <div class="usc-nav-right"></div>
</header>

<!-- CHAPTER 1 -->
<section id="ch-1" class="screen chapter">
  <div class="ch-top">
    <a href="../index.html" class="back-btn">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>
      <span>Dashboard</span>
    </a>
    <img src="images/usclogo.png" alt="United Sports Club" class="ch-logo"/>
    <span class="ch-top-spacer"></span>
  </div>
  <div class="ch-body">
    <div class="ch-eyebrow">Step 1 of 3</div>
    <h1 class="ch-title">Let's start with <em>Starters</em></h1>
    <div class="ch-visual">
      <img class="ch-img" src="images/chips.webp" alt="Masala chips" onerror="this.parentElement.classList.add('no-img')"/>
    </div>
    <div class="ch-dots"><span class="ch-dot active"></span><span class="ch-dot"></span><span class="ch-dot"></span></div>
    <button class="ch-proceed" data-act="go" data-to="pick-1">
      Proceed
      <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</section>

<!-- CHAPTER 2 -->
<section id="ch-2" class="screen chapter">
  <div class="ch-top">
    <button class="back-btn" data-act="go" data-to="pick-1">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>
      <span>Back</span>
    </button>
    <img src="images/usclogo.png" alt="United Sports Club" class="ch-logo"/>
    <span class="ch-top-spacer"></span>
  </div>
  <div class="ch-body">
    <div class="ch-eyebrow">Step 2 of 3</div>
    <h1 class="ch-title">Time for your <em>Mains</em></h1>
    <div class="ch-visual ch-visual-soft">
      <img class="ch-img" src="images/paneermakhni.webp" alt="Paneer makhni" onerror="this.parentElement.classList.add('no-img')"/>
    </div>
    <div class="ch-dots"><span class="ch-dot done"></span><span class="ch-dot active"></span><span class="ch-dot"></span></div>
    <button class="ch-proceed" data-act="go" data-to="pick-2">
      Proceed
      <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</section>

<!-- CHAPTER 3 -->
<section id="ch-3" class="screen chapter">
  <div class="ch-top">
    <button class="back-btn" data-act="go" data-to="pick-2">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>
      <span>Back</span>
    </button>
    <img src="images/usclogo.png" alt="United Sports Club" class="ch-logo"/>
    <span class="ch-top-spacer"></span>
  </div>
  <div class="ch-body">
    <div class="ch-eyebrow">Step 3 of 3</div>
    <h1 class="ch-title">Anything <em>else?</em></h1>
    <div class="ch-visual">
      <img class="ch-img" src="images/extras.webp" alt="" onerror="this.parentElement.classList.add('no-img')"/>
      <svg class="ch-fallback" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 44h48"/><path d="M12 44a20 20 0 0140 0"/><path d="M32 24v-4"/><circle cx="32" cy="17.500" r="2.500"/><path d="M6 50h52"/>
      </svg>
    </div>
    <div class="ch-dots"><span class="ch-dot done"></span><span class="ch-dot done"></span><span class="ch-dot active"></span></div>
    <button class="ch-proceed" data-act="go" data-to="cats-3-all">
      Proceed
      <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</section>

<!-- STAGE: choice, category and dish screens (built by script.js) -->
<section id="stage" class="screen menu"></section>

<!-- BOTTOM BAR -->
<div id="bar">
  <div class="bar-inner">
    <button id="bar-cart" data-act="cart-open">
      <span class="bar-bag">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12l1 13H5L6 7z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 10V6a3 3 0 016 0v4"/></svg>
        <span id="bar-count" hidden>0</span>
      </span>
      <span class="bar-text">
        <span class="bar-label">View order</span>
        <span id="bar-total">No items yet</span>
      </span>
    </button>
  </div>
</div>

<!-- CART MODAL -->
<div id="cart-modal" aria-hidden="true">
  <div class="modal-content" role="dialog" aria-label="Your order">
    <div class="modal-header">
      <h3>Your Order</h3>
      <button class="close-btn" data-act="cart-close" aria-label="Close">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-body-scroll">
      <div>
        <h4 class="section-title">Your Selection</h4>
        <div id="cart-items-list"></div>
      </div>
      <div>
        <h4 class="section-title">Your Details</h4>
        <div class="customer-info-grid">
          <div class="input-group full-width">
            <label for="cust-name">Name</label>
            <input type="text" id="cust-name" placeholder="Your name" class="modern-input" autocomplete="name">
          </div>
          <div class="input-group">
            <label for="order-date">Date</label>
            <input type="date" id="order-date" class="modern-input">
          </div>
          <div class="input-group">
            <label for="cust-people">No. of People</label>
            <input type="number" id="cust-people" value="1" min="1" class="modern-input">
          </div>
          <div class="input-group">
            <label for="order-time-now">Order Time</label>
            <input type="time" id="order-time-now" class="modern-input">
          </div>
          <div class="input-group">
            <label for="order-time">Serving Time</label>
            <input type="time" id="order-time" class="modern-input">
          </div>
          <div class="input-group full-width">
            <label>Order Type</label>
            <div class="order-type-toggle">
              <button type="button" class="order-type-btn active" data-act="otype">Dine In</button>
              <button type="button" class="order-type-btn" data-act="otype">Takeaway</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer-fixed">
      <div class="modal-footer-total">
        <span>Total</span>
        <span id="modal-total">KES 0</span>
      </div>
      <div class="modal-actions">
        <button class="clear-cart-btn" data-act="clear">Clear</button>
        <button class="whatsapp-btn" data-act="order">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-8.600 15.100L2 22l5.050-1.320A10 10 0 1012 2zm0 18.200a8.200 8.200 0 01-4.180-1.150l-.300-.180-3 .790.800-2.920-.200-.300A8.200 8.200 0 1112 20.200zm4.500-6.140c-.250-.120-1.460-.720-1.680-.800-.230-.080-.390-.120-.560.120-.160.250-.640.800-.780.970-.140.160-.290.180-.530.060a6.700 6.700 0 01-1.980-1.220 7.400 7.400 0 01-1.370-1.700c-.140-.250 0-.380.110-.500.110-.110.250-.290.370-.430.120-.140.160-.250.250-.410.080-.160.040-.310-.020-.430-.060-.120-.560-1.340-.760-1.830-.200-.480-.400-.420-.560-.420h-.470a.900.900 0 00-.660.310 2.760 2.760 0 00-.860 2.050c0 1.210.880 2.380 1 2.540.120.160 1.730 2.640 4.190 3.700.590.250 1.040.400 1.400.520.590.190 1.120.160 1.540.100.470-.070 1.460-.600 1.660-1.170.210-.580.210-1.070.150-1.170-.060-.110-.220-.170-.470-.290z"/></svg>
          Order via WhatsApp
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
